<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a full-bleed stage. Noir tokens (docs/design/EMRYS_DESIGN.md §3): a warm porcelain paper for light, near-black for dark. */
:root{
  --bg:#F2F0EA; --bg-hi:#FBFAF6; --ink:#17171B; --ink-2:#67666E; --accent:#4F5CC8;

  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){

    --cy:#8FDBE8; --ok:#97D4A6; --amb:#E8C07C; --rec:#F07B6C;
    --spot:#C9CEE8; --spot-a:.14; --ring:rgba(243,242,238,.08); --shade:#000000; --shade-a:.62; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0C; --bg-hi:#141418; --ink:#F3F2EE; --ink-2:#9E9DA4; --accent:#B7C2FF;
  --hud-bg:rgba(18,18,21,.86); --hud-line:rgba(243,242,238,.1);
  --cy:#8FDBE8; --ok:#97D4A6; --amb:#E8C07C; --rec:#F07B6C;
  --spot:#C9CEE8; --spot-a:.14; --ring:rgba(243,242,238,.08); --shade:#000000; --shade-a:.62; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{min-height:100%;display:grid;grid-template-rows:minmax(320px,1fr)}

/* the stage background stays quiet so a backlight mounted behind the svg reads through */
.stage{position:relative;min-width:0;background:radial-gradient(60% 52% at 50% 44%,var(--bg-hi),transparent 100%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}
.emrys-floor{position:absolute;left:0;top:0;width:420px;height:420px;transform-origin:0 0;pointer-events:none}
.emrys-slot{pointer-events:none}
.spot0{stop-color:var(--spot);stop-opacity:var(--spot-a)}.spot1{stop-color:var(--spot);stop-opacity:calc(var(--spot-a) * .45)}.spot2{stop-color:var(--spot);stop-opacity:0}

#gShadow{fill:var(--shade);opacity:var(--shade-a)}
#gContact{fill:var(--shade);opacity:calc(var(--shade-a) + .18)}

    p.yaw += .18 * Math.sin(t * .5) * k; p.rx += .03 * Math.sin(t * .5) * k;
  },
  place(PL, t) {
    PL.set('phone', mMul(BONES[BN.head].W, basis([0, .78, -.62], [1, 0, 0], [-.168, HELM.y - .035, HELM.z + .02], PHONE_EAR), M()));
  }
});

/* ---------------- texting ---------------- */
const PHONE_TXT = M();
defMove('text', {
  loop: true, scene: true, props: ['phone'], light: 'default',
  cam: { yaw: .3, pitch: .2, zoom: .86, ty: 1.12 },
  run(p, t) {
    const k = smooth(ramp(t, 0, .6)), cyc = t % 11;
    const L = bodyLocal('spine', .07, .25, .26), R = bodyLocal('spine', -.07, .25, .26);
    reach(p, 'L', L, k, [.8, -1, -.2], [-.6, .55, .3]);

    p.tL = lerp(p.tL, typingNow ? .4 + .5 * Math.max(0, Math.sin(t * 16)) : .55, k);
    p.tR = lerp(p.tR, typingNow ? .4 + .5 * Math.max(0, Math.sin(t * 16 + 1.6)) : .55, k);
    p.cL = lerp(p.cL, .7, k); p.cR = lerp(p.cR, .7, k);
    p.look = lerp(p.look, 0, k); p.hdX += .5 * k; p.nkX += .16 * k; p.gy = -.85; p.spX += .06 * k;
    p.rx += .025 * Math.sin(t * .7) * k;
  },
  place(PL, t) {
    PL.set('phone', mMul(BONES[BN.spine].W, basis([0, .5, .87], [0, .87, -.5], [0, .27, .29], PHONE_TXT), M()));
  }
});

/* ---------------- think: hand on chin ---------------- */
defMove('think', {
  loop: true, light: 'think',
  run(p, t) {
    const k = smooth(ramp(t, 0, .5));
    mix(p, { aRx: -.64, aRy: -1.25, aRz: -1.0, eR: 1.6, twR: .05, cR: .55, tR: .4, wRx: .23,
      aLx: -.22, aLy: -1.25, aLz: .1, eL: 1.55, cL: .3,
      hdZ: .12, hdX: -.1, spX: .06, look: 0, gx: .55, gy: .65, squint: .35, angry: -.35, mShow: .5, mSmile: -.15 }, k);

  }
});
/* =========================================================================
   Director (move switching, crossfades, settling, reactions),
   layers (breathing, blinking, look-at), input and the frame loop.
   ========================================================================= */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const pose = newPose(), work = newPose();
const D = {
  cur: MOVES.idle, t: 0, prev: newPose(), blendT: 9, blendDur: .35,
  settle: null, settleT: 0, resume: null,
  fired: new Set(), ticks: {}, pokes: [], idleT: 0, lastInput: 0, fidgetAt: 8, fidgetN: 0,
};
let time = 0;
const ctx = {
  say(text, at, o = {}) {
    let base;
    if (PROPS[at]) base = mPt(BONES[PROPS[at].bone].W, 0, .13, 0);
    else { const Wb = BONES[BN[at]].W; base = at === 'head' ? mPt(Wb, (o.side || 0) * .13, .45, .05) : mPt(Wb, 0, -.1, 0); }

  tick(id, period, fn) { const n = Math.floor(D.t / period); if (D.ticks[id] !== n) { D.ticks[id] = n; fn(n); } },

function play(id, o = {}) {

function toIdle() { play(Math.hypot(body.x, body.z) > .3 ? 'home' : 'idle'); }
defMove('home', {
  loop: true, loco: true,
  run(p, t, dt) {
    const face = wrapA(cam.yaw + cam.sway);
    const dist = locoStep(dt, { tx: 0, tz: 0, face, speed: .45, gait: 'walk', arrive: true });
    locoPose(p, t, .6);
    if (t > .4 && dist < .07 && !LOCO.moving && Math.abs(wrapA(face - body.heading)) < .12) { D.settle = null; const nx = D.after; D.after = null; play(nx || 'idle', { force: true, here: true }); }
  }
});
defMove('turn', {
  loop: true, loco: true,
  run(p, t, dt) {
    const face = wrapA(cam.yaw + cam.sway);
    locoStep(dt, { face, speed: 0, gait: 'walk' });
    locoPose(p, t, 1);

/* poke reactions by body part */
function poke(part) {

  D.lastInput = now;
  if (D.cur.scene || D.cur.id === 'home') { D.react = { part, t: time }; ctx.say(part === 1 ? '!?' : '!', 'head', { size: 1.1, color: 'var(--accent)' }); return; }

  if (!r) return;
  play(r, { force: true, blend: .14 });

}

/* ---------- layers ---------- */
const blink = { next: 2, t: -1, dbl: false };
const MOUTH = { o: 0, w: 1, r: 0, ext: {}, extT: -9 };
function layers(p, dt) {
  const br = D.cur.loco ? .4 : 1, b = Math.sin(time * 1.75);

  p.aLz += .012 * b * br; p.aRz += .012 * b * br;

  const pat = !dragging && pointer.active && pointer.part === 1 && D.cur.id === 'idle';

  if (time - MOUTH.extT < .3) {

    for (const k in MOUTH.ext) { const v = VISEMES[k]; if (!v) continue; const a = clamp(MOUTH.ext[k], 0, 1); o += v[0] * a; w += v[1] * a; r += v[2] * a; tot += a; }
    p.mShow = Math.max(p.mShow, .95); p.mOpen = clamp(o, 0, 1.1);

}

/* ---------- look target ---------- */
const pointer = { x: 0, y: 0, active: false, t: -9, part: 0, hover: 0 };
function updateLook(dt) {
  const head = mPt(BONES[BN.head].W, 0, .215, 0);
  let tx = CB.p[0], ty = CB.p[1], tz = CB.p[2];
  if (pointer.active && time - pointer.t < 4) {
    const rx = (pointer.x - OX) / FOC, ry = -(pointer.y - OY) / FOC;
    const dir = norm3([CB.f[0] + CB.r[0] * rx + CB.u[0] * ry, CB.f[1] + CB.r[1] * rx + CB.u[1] * ry, CB.f[2] + CB.r[2] * rx + CB.u[2] * ry]);
    const pp = [head[0] - CB.f[0] * 1.3, head[1] - CB.f[1] * 1.3, head[2] - CB.f[2] * 1.3];
    const den = dot3(dir, CB.f);
    if (Math.abs(den) > 1e-4) {
      const s = ((pp[0] - CB.p[0]) * CB.f[0] + (pp[1] - CB.p[1]) * CB.f[1] + (pp[2] - CB.p[2]) * CB.f[2]) / den;
      tx = CB.p[0] + dir[0] * s; ty = CB.p[1] + dir[1] * s; tz = CB.p[2] + dir[2] * s;

  look.x = damp(look.x, tx, 9, dt); look.y = damp(look.y, ty, 9, dt); look.z = damp(look.z, tz, 9, dt);
}

/* ---------- frame ---------- */
function step(dt) {
  time += dt; D.t += dt; D.blendT += dt;
  copyPose(work, REST);
  if (D.settle) {
    D.settleT += dt;
    locoStep(dt, { speed: 0, face: body.heading });
    locoPose(work, D.t, .5);
    if (!LOCO.moving || D.settleT > 1.1) { const id = D.settle; D.settle = null; play(id, { force: true }); copyPose(work, REST); D.cur.run(work, 0, dt, ctx); }
  } else D.cur.run(work, D.t, dt, ctx);

  const b = smooth(D.blendT / D.blendDur);
  if (b < 1) blendPose(pose, D.prev, work, b); else copyPose(pose, work);

  updateLightRig(dt);
  if (D.cur.dur && D.t >= D.cur.dur) finish();
  /* idle upkeep: turn to face the viewer after they orbit around */
  if (D.cur.id === 'idle') {
    D.idleT += dt;
    if (D.idleT > 2.6 && !dragging && Math.abs(wrapA(cam.yaw + cam.sway - body.heading)) > 1.15) play('turn');
    else if (D.idleT > D.fidgetAt) { D.fidgetAt = 7 + Math.random() * 6; play(['stretch', 'scan', 'tap'][D.fidgetN++ % 3]); }
  }

  cam.ty = damp(cam.ty, (hint && hint.ty ? hint.ty : cam.rest) + Math.max(0, pose.ry) * .5, 2.5, dt);
  if (hint) {
    cam.yaw = dampA(cam.yaw, hint.yaw, 1.6, dt); cam.pitch = damp(cam.pitch, hint.pitch, 1.6, dt); cam.zoom = damp(cam.zoom, hint.zoom, 1.6, dt);
    if (hint.restore && Math.abs(wrapA(cam.yaw - hint.yaw)) < .01 && Math.abs(cam.zoom - hint.zoom) < .01) D.camHint = null;
  }

}
/* props: presence (pop in/out), default placement, scene overrides */
const FMS = M();
function frameMat(frame, x, y, z, rx, ry, rz, out) { return mMul(frame === 'G' ? G : BONES[BN[frame]].W, mEuler(rx, ry, rz, x, y, z, FMS), out); }
const PL = {
  mat: (frame, x, y, z, rx = 0, ry = 0, rz = 0) => frameMat(frame, x, y, z, rx, ry, rz, M()),
  set(id, m) { const P = PROPS[id]; mCopy(m, P.base); P.setNow = true; P.placed = true; },
  force(id, w) { PROPS[id].force = w; },
};
function placeProps(dt) {
  const want = new Set(D.cur.props || []);
  if (D.blendT < D.blendDur && D.prevMove && D.prevMove.props) for (const id of D.prevMove.props) want.add(id);
  for (const P of PROP_LIST) { P.force = null; P.setNow = false; }
  if (D.cur.place) D.cur.place(PL, D.t);
  for (const P of PROP_LIST) {
    const w = P.force !== null ? P.force : want.has(P.id) ? 1 : 0;
    P.want = w; P.pres = damp(P.pres, w, w > P.pres ? 7 : 10, dt); if (w === 0 && P.pres < .01) P.pres = 0;

    if (!vis) continue;

function render(dt) {

  arrangeSlots(act);
  flush(act); flushGlow(); drawShadows(); drawPool();
  if (cam.dirty) { drawFloor(); cam.dirty = false; }

  drawFx(dt);

/* ---------- camera & poke input ---------- */
const stage = $('stage');
let dragging = false, camVel = 0;
const ptrs = new Map(); let down = null, pinch0 = 0, zoom0 = 1;
function resetView() { cam.yaw = body.heading; cam.pitch = .13; cam.zoom = 1; camVel = 0; D.lastInput = time; D.camHint = null; D.camUser = false; if (D.cur.cam) D.camHint = Object.assign({}, D.cur.cam, { yaw: D.cur.cam.yaw + body.heading }); }
stage.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, [e.clientX, e.clientY]); stage.setPointerCapture(e.pointerId);
  D.lastInput = time;
  if (ptrs.size === 1) { down = { x: e.clientX, y: e.clientY, t: performance.now(), target: e.target, moved: false }; cam.yaw += cam.sway; cam.sway = 0; camVel = 0; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom0 = cam.zoom; if (down) down.moved = true; }
});
stage.addEventListener('pointermove', e => {
  const rect = svg.getBoundingClientRect();
  pointer.x = e.clientX - rect.left; pointer.y = e.clientY - rect.top; pointer.active = true; pointer.t = time; D.lastInput = time;
  pointer.part = e.target.__face >= 0 ? fPart[e.target.__face] : 0;
  if (!ptrs.has(e.pointerId)) return;

    cam.yaw -= dx * .0085; cam.pitch = clamp(cam.pitch + dy * .006, .03, 1.2); camVel = -dx * .0085 / Math.max(.008, 1 / 60);
    D.lastInput = time;
  }
});
function endPtr(e) {
  ptrs.delete(e.pointerId);

}
stage.addEventListener('pointerup', endPtr);

stage.addEventListener('dblclick', resetView);

function resize() {
  const r = stage.getBoundingClientRect();
  VW = Math.max(200, Math.round(r.width)); VH = Math.max(200, Math.round(r.height)); STAGE_H = r.height;
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);

}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- boot ---------- */
locoPlant();
let last = performance.now(), slowT = 0, lowFx = false;

function frame(now) {
  const dt = Math.min(.05, Math.max(.001, (now - last) / 1000)); last = now;
  step(dt); render(dt);
  if (!lowFx && !document.hidden) { if (dt > 1 / 24) slowT += dt; else slowT = Math.max(0, slowT - dt * .5); if (slowT > 4) degrade(); }
  requestAnimationFrame(frame);
}
step(1 / 60); render(1 / 60);
requestAnimationFrame(frame);
window.emrys = {
  viseme(key, value) { key = String(key).replace(/^viseme_/, ''); key = VALIAS[key] || key; MOUTH.ext[key] = +value || 0; MOUTH.extT = time; },
  /* the Matrix slots (docs/design/EMRYS_MATRIX.md §3): whether each is on screen and how squarely it faces the camera */

};
</script>
