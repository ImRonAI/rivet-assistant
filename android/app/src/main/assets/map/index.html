<!doctype html>
<!-- Emrys's place map: MapLibre GL JS over OpenFreeMap's dark style, numbered Noir pins from window.emrysMap.show(). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  /* Noir: a noir glass disc with a porcelain hairline and a Geist figure; the chosen pin turns porcelain in a halo light. */
  @font-face { font-family: "Geist"; font-weight: 500; src: url("../emrys/fonts/geist_medium.ttf") format("truetype"); }
  html, body, #map { margin: 0; height: 100%; background: transparent; }
  /* MapLibre positions the marker element with an inline transform, so the pin's look lives on its span. */
  .pin {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .pin span {
    width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 10, 12, .85); border: 1px solid rgba(243, 242, 238, .55); color: #F3F2EE;
    font: 500 12px/1 Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums;
    box-shadow: 0 1px 10px rgba(0, 0, 0, .5);
    transition: background-color 260ms cubic-bezier(.2, 0, 0, 1), color 260ms cubic-bezier(.2, 0, 0, 1),
      box-shadow 260ms cubic-bezier(.2, 0, 0, 1), transform 260ms cubic-bezier(.2, 0, 0, 1);
  }
  .pin.on span {
    background: #F3F2EE; border-color: #F3F2EE; color: #0A0A0C; transform: scale(1.12);
    box-shadow: 0 0 0 3px rgba(10, 10, 12, .85), 0 0 0 4px rgba(183, 194, 255, .55), 0 0 22px rgba(183, 194, 255, .45);
  }
  @media (prefers-reduced-motion: reduce) { .pin span { transition: none; } }
  /* OpenStreetMap and OpenFreeMap's attribution stays, set on noir glass with legible grey links. */
  .maplibregl-ctrl.maplibregl-ctrl-attrib,
  .maplibregl-ctrl-attrib.maplibregl-compact {
    background-color: rgba(10, 10, 12, .8); color: #9E9DA4; box-shadow: inset 0 0 0 1px rgba(243, 242, 238, .07);
    font: 400 10px/1.5 Geist, system-ui, sans-serif;
  }
  .maplibregl-ctrl-attrib a { color: #C9C8CE; }
  .maplibregl-ctrl-attrib-button,
  .maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-button { background-color: transparent; filter: invert(.9); }
</style>
<script src="maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>
<script>
  const STYLE = "https://tiles.openfreemap.org/styles/dark";
  let map = null;
  let interactive = null;
  let pins = [];

  function post(message) {
    if (window.EmrysMap) EmrysMap.postMessage(JSON.stringify(message));
  }

  function pin(place) {
    const element = document.createElement("div");
    element.className = "pin";
    element.setAttribute("aria-label", place.n + ". " + place.title);
    const label = document.createElement("span");
    label.textContent = String(place.n);
    element.appendChild(label);
    element.addEventListener("click", (event) => {
      event.stopPropagation();
      post({ type: "select", n: place.n });
    });
    // MapLibre takes [lng, lat].
    return { n: place.n, marker: new maplibregl.Marker({ element }).setLngLat([place.lng, place.lat]).addTo(map) };
  }

  window.emrysMap = {
    show(data) {
      if (map === null || interactive !== data.interactive) {
        if (map !== null) map.remove();
        interactive = data.interactive;
        map = new maplibregl.Map({ container: "map", style: STYLE, interactive: data.interactive, center: [0, 0], zoom: 1 });
      }
      pins.forEach((p) => p.marker.remove());
      pins = data.places.map(pin);
      if (data.places.length > 0) {
        const bounds = new maplibregl.LngLatBounds();
        data.places.forEach((p) => bounds.extend([p.lng, p.lat]));
        map.fitBounds(bounds, { padding: 48, maxZoom: 15, animate: false });
      }
      window.emrysMap.select(data.selected);
    },
    select(n) {
      pins.forEach((p) => p.marker.getElement().classList.toggle("on", p.n === n));
    },
  };
  post({ type: "ready" });
</script>
</body>
</html>
