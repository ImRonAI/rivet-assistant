<!doctype html>
<!-- Ren's place map: MapLibre GL JS over OpenFreeMap's light or dark style, numbered pins from window.renMap.show(). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  /* Ink & Volt: a paper disc with a hairline and an ink figure; the chosen pin is volt. Dark has no colour but volt. */
  @font-face { font-family: "Inter Variable"; font-weight: 100 900; src: url("/res/font/inter.ttf") format("truetype"); }
  :root { --disc: #FFFFFF; --line: #D3D4DC; --ink: #0B0C17; --muted: #72747E; --link: #4A4C58; --volt: #5543FF; --on-volt: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --disc: #141414; --line: #2C2C2C; --ink: #F5F5F5; --muted: #919191; --link: #BDBDBD; --volt: #8D98FE; --on-volt: #0C0C0C; }
  }
  html, body, #map { margin: 0; height: 100%; background: transparent; }
  /* MapLibre positions the marker element with an inline transform, so the pin's look lives on its span. */
  .pin {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .pin span {
    width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--disc); border: 1px solid var(--line); color: var(--ink);
    font: 600 12px/1 "Inter Variable", system-ui, sans-serif; font-variant-numeric: tabular-nums;
    transition: background-color 220ms cubic-bezier(.2, 0, 0, 1), color 220ms cubic-bezier(.2, 0, 0, 1),
      transform 220ms cubic-bezier(.2, 0, 0, 1);
  }
  .pin.on span { background: var(--volt); border-color: var(--volt); color: var(--on-volt); transform: scale(1.12); }
  @media (prefers-reduced-motion: reduce) { .pin span { transition: none; } }
  /* OpenStreetMap and OpenFreeMap's attribution stays, set on the pin's paper with legible links. */
  .maplibregl-ctrl.maplibregl-ctrl-attrib,
  .maplibregl-ctrl-attrib.maplibregl-compact {
    background-color: var(--disc); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line);
    font: 400 10px/1.5 "Inter Variable", system-ui, sans-serif;
  }
  .maplibregl-ctrl-attrib a { color: var(--link); }
  .maplibregl-ctrl-attrib-button,
  .maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-button { background-color: transparent; }
  @media (prefers-color-scheme: dark) {
    .maplibregl-ctrl-attrib-button,
    .maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-button { filter: invert(.9); }
  }
</style>
<script src="maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>
<script>
  // OpenFreeMap's light and dark styles, by the phone's theme.
  const STYLE = "https://tiles.openfreemap.org/styles/" + (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "positron");
  let map = null;
  let interactive = null;
  let pins = [];

  function post(message) {
    if (window.RenMap) RenMap.postMessage(JSON.stringify(message));
  }

  function pin(place) {
    const element = document.createElement("div");
    element.className = "pin";
    element.setAttribute("aria-label", place.n + ". " + place.title);
    const label = document.createElement("span");
    label.textContent = String(place.n);
    element.appendChild(label);
    element.addEventListener("click", (event) => {
      event.stopPropagation();
      post({ type: "select", n: place.n });
    });
    // MapLibre takes [lng, lat].
    return { n: place.n, marker: new maplibregl.Marker({ element }).setLngLat([place.lng, place.lat]).addTo(map) };
  }

  window.renMap = {
    show(data) {
      if (map === null || interactive !== data.interactive) {
        if (map !== null) map.remove();
        interactive = data.interactive;
        map = new maplibregl.Map({ container: "map", style: STYLE, interactive: data.interactive, center: [0, 0], zoom: 1 });
      }
      pins.forEach((p) => p.marker.remove());
      pins = data.places.map(pin);
      if (data.places.length > 0) {
        const bounds = new maplibregl.LngLatBounds();
        data.places.forEach((p) => bounds.extend([p.lng, p.lat]));
        map.fitBounds(bounds, { padding: 48, maxZoom: 15, animate: false });
      }
      window.renMap.select(data.selected);
    },
    select(n) {
      pins.forEach((p) => p.marker.getElement().classList.toggle("on", p.n === n));
    },
  };
  post({ type: "ready" });
</script>
</body>
</html>
