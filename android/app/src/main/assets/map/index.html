<!doctype html>
<!-- Rivet's place map: MapLibre GL JS over OpenFreeMap's dark style, numbered pins from window.rivetMap.show(). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; background: transparent; }
  .pin {
    width: 26px; height: 26px; border-radius: 13px 13px 13px 3px; transform: rotate(-45deg);
    background: #1D232B; border: 2px solid #FF5A1F; box-shadow: 0 2px 6px rgba(0, 0, 0, .6);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .pin span { transform: rotate(45deg); font: 600 12px/1 sans-serif; color: #E8ECF0; }
  .pin.on { background: #FF5A1F; border-color: #FFFFFF; }
  .pin.on span { color: #13171C; }
</style>
<script src="maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>
<script>
  const STYLE = "https://tiles.openfreemap.org/styles/dark";
  let map = null;
  let interactive = null;
  let pins = [];

  function post(message) {
    if (window.RivetMap) RivetMap.postMessage(JSON.stringify(message));
  }

  function pin(place) {
    const element = document.createElement("div");
    element.className = "pin";
    element.setAttribute("aria-label", place.n + ". " + place.title);
    const label = document.createElement("span");
    label.textContent = String(place.n);
    element.appendChild(label);
    element.addEventListener("click", (event) => {
      event.stopPropagation();
      post({ type: "select", n: place.n });
    });
    // MapLibre takes [lng, lat].
    return { n: place.n, marker: new maplibregl.Marker({ element }).setLngLat([place.lng, place.lat]).addTo(map) };
  }

  window.rivetMap = {
    show(data) {
      if (map === null || interactive !== data.interactive) {
        if (map !== null) map.remove();
        interactive = data.interactive;
        map = new maplibregl.Map({ container: "map", style: STYLE, interactive: data.interactive, center: [0, 0], zoom: 1 });
      }
      pins.forEach((p) => p.marker.remove());
      pins = data.places.map(pin);
      if (data.places.length > 0) {
        const bounds = new maplibregl.LngLatBounds();
        data.places.forEach((p) => bounds.extend([p.lng, p.lat]));
        map.fitBounds(bounds, { padding: 48, maxZoom: 15, animate: false });
      }
      window.rivetMap.select(data.selected);
    },
    select(n) {
      pins.forEach((p) => p.marker.getElement().classList.toggle("on", p.n === n));
    },
  };
  post({ type: "ready" });
</script>
</body>
</html>
