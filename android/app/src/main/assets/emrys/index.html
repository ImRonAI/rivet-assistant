<title>Emrys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one editorial spread. A quiet status line on top, the full-bleed stage, a dock of soft pills below.
   Noir tokens (docs/design/EMRYS_DESIGN.md §3): the light block is a warm porcelain paper, the dark one near-black. */
:root{
  --bg:#F2F0EA; --bg-hi:#FBFAF6; --ink:#17171B; --ink-2:#67666E; --line:rgba(23,23,27,.08); --line-hi:rgba(23,23,27,.16);
  --accent:#4F5CC8; --accent-hi:#7F8EF0; --accent-ink:#F7F6F2; --accent-soft:rgba(79,92,200,.12);
  --key:#FBFAF6; --card-hi:#ECE9E2; --tile:#E8E5DE; --hud-bg:rgba(251,250,246,.9); --hud-line:rgba(23,23,27,.1);
  --cy:#2C8FA2; --ok:#3D8F5C; --amb:#A87423; --rec:#C4513E;
  --spot:#FFFFFF; --spot-a:.85; --ring:rgba(23,23,27,.09); --shade:#3B3428; --shade-a:.2;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0C; --bg-hi:#141418; --ink:#F3F2EE; --ink-2:#9E9DA4; --line:rgba(243,242,238,.07); --line-hi:rgba(243,242,238,.14);
    --accent:#B7C2FF; --accent-hi:#CDD5FF; --accent-ink:#0A0A0C; --accent-soft:rgba(183,194,255,.12);
    --key:#18181C; --card-hi:#17171B; --tile:#1A1A1E; --hud-bg:rgba(18,18,21,.86); --hud-line:rgba(243,242,238,.1);
    --cy:#8FDBE8; --ok:#97D4A6; --amb:#E8C07C; --rec:#F07B6C;
    --spot:#C9CEE8; --spot-a:.14; --ring:rgba(243,242,238,.08); --shade:#000000; --shade-a:.62; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0C; --bg-hi:#141418; --ink:#F3F2EE; --ink-2:#9E9DA4; --line:rgba(243,242,238,.07); --line-hi:rgba(243,242,238,.14);
  --accent:#B7C2FF; --accent-hi:#CDD5FF; --accent-ink:#0A0A0C; --accent-soft:rgba(183,194,255,.12);
  --key:#18181C; --card-hi:#17171B; --tile:#1A1A1E; --hud-bg:rgba(18,18,21,.86); --hud-line:rgba(243,242,238,.1);
  --cy:#8FDBE8; --ok:#97D4A6; --amb:#E8C07C; --rec:#F07B6C;
  --spot:#C9CEE8; --spot-a:.14; --ring:rgba(243,242,238,.08); --shade:#000000; --shade-a:.62; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{min-height:100%;display:grid;grid-template-rows:auto minmax(320px,1fr) auto}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.hud{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.id{display:flex;align-items:baseline;gap:12px;min-width:0}
.mark{font:400 32px/1 var(--f-display);letter-spacing:-.01em}
.mark i{display:inline-block;width:6px;height:6px;margin-left:3px;border-radius:50%;background:var(--accent);vertical-align:.1em}
.unit{font:400 12px/1.3 var(--f-ui);color:var(--ink-2)}
.status{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:0;font:400 12px/1.3 var(--f-ui);color:var(--ink-2)}
.status .sdot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status #tMode{color:var(--ink);font-weight:500}
.status .fig{font:400 11.5px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}

/* the stage background stays quiet so a backlight mounted behind the svg reads through */
.stage{position:relative;min-width:0;background:radial-gradient(60% 52% at 50% 44%,var(--bg-hi),transparent 100%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}
.emrys-floor{position:absolute;left:0;top:0;width:420px;height:420px;transform-origin:0 0;pointer-events:none}
.emrys-slot{pointer-events:none}
.hint{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:14px;margin:0;font:400 12px/1.3 var(--f-ui);color:var(--ink-2);pointer-events:none;max-width:calc(100% - 40px)}
.spot0{stop-color:var(--spot);stop-opacity:var(--spot-a)}.spot1{stop-color:var(--spot);stop-opacity:calc(var(--spot-a) * .45)}.spot2{stop-color:var(--spot);stop-opacity:0}
.plate-ring{fill:none;stroke:var(--ring);stroke-width:1}
#gShadow{fill:var(--shade);opacity:var(--shade-a)}
#gContact{fill:var(--shade);opacity:calc(var(--shade-a) + .18)}
#gMesh .seg path{stroke-width:.65;stroke-linejoin:round}
#gFx .glyph{font:italic 400 24px var(--f-display);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
#gFx .pill rect{fill:var(--hud-bg);stroke:var(--hud-line);stroke-width:1}
#gFx .pill text{font:500 13px var(--f-ui);fill:var(--ink)}

/* stage cards: Noir glass, Geist text, sentence case, status dots */
.ovl text{font-family:var(--f-ui)}
.hud-bg{fill:var(--hud-bg);stroke:var(--hud-line);stroke-width:1}
.hud-s{font:400 21px var(--f-display);letter-spacing:-.01em;fill:var(--ink)}
.hud-h{font:500 13px var(--f-ui);fill:var(--ink)}
.hud-e{font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;fill:var(--ink-2)}
.hud-m{font:400 11px var(--f-ui);fill:var(--ink-2)}
.ovl .mono{font-family:var(--f-mono);font-size:10.5px;font-variant-numeric:tabular-nums}
.ovl .hud-t{font:400 12.5px var(--f-ui);fill:var(--ink)}
.hud-rule{stroke:var(--hud-line);stroke-width:1}
.ovl .live{fill:var(--cy);animation:pulse 2.4s ease-in-out infinite}
.ovl .live.red{fill:var(--rec)}
@keyframes pulse{50%{opacity:.3}}
.tnode{stroke:var(--hud-bg);stroke-width:3}
.tnode.acc{fill:var(--accent)}.tnode.cy{fill:var(--cy)}.tnode.ok{fill:var(--ok)}.tnode.amb{fill:var(--amb)}.tnode.mut{fill:var(--ink-2)}
.ovl .ttag{font:500 10.5px var(--f-ui);fill:var(--ink-2)}
.ovl .ttext{font:400 12.5px var(--f-ui);fill:var(--ink)}
.ovl .tlab{font:400 11px var(--f-ui);fill:var(--ink-2)}.ovl .tval{font:400 10.5px var(--f-mono);fill:var(--ink-2)}
.tspine{stroke:var(--hud-line);stroke-width:1}
.tbarbg{fill:var(--line-hi)}.tbar.acc{fill:var(--accent)}.tbar.mut{fill:var(--ink-2);fill-opacity:.6}
.trow.hot .ttext{font-weight:500}.trow.hot .ttag{fill:var(--accent)}
.hud-fade-top{fill:url(#hfT)}.hud-fade-bot{fill:url(#hfB)}
.hf0{stop-color:var(--hud-bg);stop-opacity:1}.hf1{stop-color:var(--hud-bg);stop-opacity:0}
.flow{fill:none;stroke:var(--cy);stroke-width:1;stroke-dasharray:1 6;stroke-linecap:round;opacity:.55}
.flowdots circle{fill:var(--cy)}
.lead{fill:none;stroke:var(--ink-2);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round;opacity:.5}
.sdot{fill:var(--cy)}.sdot.ok{fill:var(--ok)}.sdot.amb{fill:var(--amb)}
.btn{fill:var(--ink)}.send.on .btn{fill:var(--accent-hi)}.ovl .btn-t{font:500 12px var(--f-ui);fill:var(--accent-ink)}
.plane path{fill:var(--accent)}
.tile{fill:var(--tile)}.tring{fill:none;stroke:transparent;stroke-width:1.5}.tring.on{stroke:var(--accent)}
.p1{fill:#7F86A6}.b1{fill:#3A3A42}.b2{fill:#141417}.b3{fill:#8FDBE8}.p2{fill:#9A8A7C}.ovl .ini{font:500 12px var(--f-ui);fill:#F3F2EE}
.rv{fill:#ECEAE4}.rvv{fill:#14151B}.rve{fill:#B7C2FF}.ctl{fill:var(--line-hi)}.end{fill:var(--rec)}
.avc{fill:var(--accent-soft);stroke:var(--accent);stroke-opacity:.5;stroke-width:1}.ovl .avi{font:500 11px var(--f-ui);fill:var(--accent)}
.bub rect{fill:var(--tile)}.bub.me rect{fill:var(--accent)}.ovl .bub text{font:400 12px var(--f-ui);fill:var(--ink)}.ovl .bub.me text{fill:var(--accent-ink)}.bub.typing text{letter-spacing:.2em}
@media (prefers-reduced-motion: reduce){.ovl .live{animation:none}}

.tabs{display:none;flex-wrap:wrap;gap:2px 20px;width:100%;margin-bottom:4px}
.tab{appearance:none;border:0;background:none;padding:10px 0 8px;font:500 13px/1 var(--f-ui);color:var(--ink-2);border-bottom:1px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media (max-width:979px){.tabs{display:flex}.dock .grp:not(.on){display:none}.dock .glabel{display:none}}
.dock{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 22px;padding-block:14px 20px;border-top:1px solid var(--line)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.glabel{font:500 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);width:100%;margin-bottom:4px}
.key{appearance:none;display:inline-flex;white-space:nowrap;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--key);color:var(--ink);font:500 13px/1 var(--f-ui);cursor:pointer;transition:background-color .14s cubic-bezier(.2,0,0,1),border-color .14s cubic-bezier(.2,0,0,1),color .14s cubic-bezier(.2,0,0,1)}
.key:hover{border-color:var(--line-hi)}
.key:active{background:var(--card-hi);border-color:var(--line-hi)}
.key kbd{font:400 10.5px/1 var(--f-mono);color:var(--ink-2)}
.key[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}
.key[aria-pressed="true"] kbd{color:var(--accent-ink);opacity:.55}
.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.key.sys:not(.act)::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-2);opacity:.45}
.key.sys[aria-pressed="true"]{background:var(--key);color:var(--ink);border-color:var(--line-hi)}
.key.sys[aria-pressed="true"]::before{background:var(--accent);opacity:1}
.key.sys[aria-pressed="true"] kbd{color:var(--ink-2);opacity:1}
@media (min-width:980px){
  html,body{overflow:hidden}
  .app{height:100%;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr)}
  .hud{grid-column:1 / -1}
  .stage{grid-column:1;grid-row:2}
  /* embedded in the app the header and dock are hidden: the stage takes the whole page */
  html.embedded .stage{grid-column:1 / -1;grid-row:1}
  .dock{grid-column:2;grid-row:2;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:24px;border-top:0;border-left:1px solid var(--line);overflow-y:auto;padding-block:24px;padding-left:24px}
  .dock .grp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .dock .grp.ctl{grid-template-columns:minmax(0,1fr)}
  .dock .glabel{grid-column:1 / -1}
  .dock .key{justify-content:space-between;width:100%;min-width:0}
  .dock .key.sys{justify-content:flex-start}
  .dock .key.sys kbd{margin-left:auto}
}
@media (max-width:560px){
  .mark{font-size:28px}
  .dock{gap:8px;padding-block:12px 16px}
  .grp{display:contents}
  .glabel{display:none}
  .key{padding:0 14px}
  .key kbd{display:none}
  .hint .long{display:none}
}
@media (prefers-reduced-motion: reduce){ .key{transition:none} }
</style>

<div class="app">
  <header class="hud pad">
    <div class="id"><span class="mark">Emrys<i aria-hidden="true"></i></span><span class="unit">R-7 utility unit, rigged in SVG</span></div>
    <p class="status" aria-live="off"><span class="sdot" aria-hidden="true"></span><span id="tMode">Idle</span><span aria-hidden="true">·</span><span class="fig" id="tFps">— fps</span><span aria-hidden="true">·</span><span class="fig"><span id="tPoly">—</span> faces</span></p>
  </header>

  <section class="stage" id="stage" aria-label="Emrys, an interactive 3D figure. Drag to orbit, scroll or pinch to zoom, tap Emrys to poke.">
    <div class="emrys-floor" id="slot-floor"><div class="emrys-slot-root" style="width:420px;height:420px"></div></div>
    <svg id="view" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Emrys">
      <defs>
        <filter id="fShadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="fContact" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="fGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
        <linearGradient id="hfT" x1="0" y1="0" x2="0" y2="1"><stop class="hf0" offset="0"/><stop class="hf1" offset="1"/></linearGradient>
        <linearGradient id="hfB" x1="0" y1="1" x2="0" y2="0"><stop class="hf0" offset="0"/><stop class="hf1" offset="1"/></linearGradient>
        <radialGradient id="gPool"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="gSpot"><stop class="spot0" offset="0"/><stop class="spot1" offset=".5"/><stop class="spot2" offset="1"/></radialGradient>
        <linearGradient id="gVisor" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
          <stop offset="0" stop-color="#4A4F6E"/><stop offset=".25" stop-color="#20222F"/><stop offset=".62" stop-color="#0E0F15"/><stop offset="1" stop-color="#060608"/>
        </linearGradient>
      </defs>
      <g id="gFloor"></g>
      <path id="pPool" fill="url(#gPool)"/>
      <g id="gShadow" filter="url(#fShadow)"><path id="pShadow"/></g>
      <g id="gContact" filter="url(#fContact)"><path id="pContact"/></g>

      <g id="gGlow" filter="url(#fGlow)"></g>

  </section>

  <nav class="dock pad" id="dock" aria-label="Movements"></nav>
</div>

<script>
'use strict';
/* =========================================================================
   EMRYS — a real-time 3D figure rendered entirely as SVG polygons.
   Core: math, easing, affine matrices, procedural geometry.
   ========================================================================= */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, a, b) => sat((t - a) / (b - a));
const smooth = t => { t = sat(t); return t * t * (3 - 2 * t); };
const smoother = t => { t = sat(t); return t * t * t * (t * (t * 6 - 15) + 10); };
const easeOut = t => { t = sat(t); return 1 - (1 - t) ** 3; };
const easeIn = t => { t = sat(t); return t * t * t; };
const easeIO = t => { t = sat(t); return t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; };
const backOut = (t, s = 1.7) => { t = sat(t); const u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; };

/* window: rises a→b, holds, falls c→d (all smooth) */
const win = (t, a, b, c, d) => smooth(ramp(t, a, b)) * (1 - smooth(ramp(t, c, d)));
/* keyframe track: [[time,value],...] with smoother easing between keys */
function track(t, k, ease = smoother) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {

}
/* critically damped approach (frame-rate independent) */
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
const dampA = (cur, target, rate, dt) => lerpA(cur, target, 1 - Math.exp(-rate * dt));
/* deterministic hash noise for idle variation */
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };

/* ---------- affine 3x4 matrices: [r00 r01 r02 tx | r10 r11 r12 ty | r20 r21 r22 tz] ---------- */
const M = () => { const m = new Float64Array(12); m[0] = m[5] = m[10] = 1; return m; };

function mMul(a, b, o) {
  const a0 = a[0], a1 = a[1], a2 = a[2], a3 = a[3], a4 = a[4], a5 = a[5], a6 = a[6], a7 = a[7], a8 = a[8], a9 = a[9], a10 = a[10], a11 = a[11];
  const b0 = b[0], b1 = b[1], b2 = b[2], b3 = b[3], b4 = b[4], b5 = b[5], b6 = b[6], b7 = b[7], b8 = b[8], b9 = b[9], b10 = b[10], b11 = b[11];
  o[0] = a0 * b0 + a1 * b4 + a2 * b8; o[1] = a0 * b1 + a1 * b5 + a2 * b9; o[2] = a0 * b2 + a1 * b6 + a2 * b10; o[3] = a0 * b3 + a1 * b7 + a2 * b11 + a3;

  o[8] = a8 * b0 + a9 * b4 + a10 * b8; o[9] = a8 * b1 + a9 * b5 + a10 * b9; o[10] = a8 * b2 + a9 * b6 + a10 * b10; o[11] = a8 * b3 + a9 * b7 + a10 * b11 + a11;
  return o;
}
/* Euler, order R = Rz(z)·Rx(x)·Ry(y), plus translation */
function mEuler(x, y, z, tx, ty, tz, o) {

  return o;
}

  addPart('spine', warp(lathe([[.116, .06], [.104, .02], [.108, -.03], [.112, -.06]], 14), (x, y, z) => [x, y, z * .8]), 'graphite', { part: 'torso', shadow: false });

    const plate = extrude(rrect(GAUNT.hw, GAUNT.hl, .016, 3), -.012, .0035), pf = plate.f.length - 1;

/* ---------- rig evaluation ---------- */
const G = M(), T1 = M(), T2 = M(), T3 = M(), T4 = M(), T5 = M(), T6 = M(), T7 = M();
const look = { yaw: 0, pitch: 0, tYaw: 0, tPitch: 0, x: 0, y: 1.8, z: 3, w: 0, gx: 0, gy: 0 };
const rigOut = { gx: 0, gy: 0 };


/* 2-bone arm IK in the clavicle frame. Target = wrist, blended between body (G), spine and head frames.
   Pole (body frame) says which way the elbow points. Returns the upper-arm local rotation and elbow bend. */
const IKR = M();
function armIK(Sd, sg, p, C, H, S) {
  const x = p['h' + Sd + 'x'], y = p['h' + Sd + 'y'], z = p['h' + Sd + 'z'], fs = p['h' + Sd + 's'], fh = p['h' + Sd + 'h'];
  let t = mPt(G, x, y, z);
  if (fs > 0) { const q = mPt(S, x, y, z); t = [lerp(t[0], q[0], fs), lerp(t[1], q[1], fs), lerp(t[2], q[2], fs)]; }
  if (fh > 0) { const q = mPt(H, x, y, z); t = [lerp(t[0], q[0], fh), lerp(t[1], q[1], fh), lerp(t[2], q[2], fh)]; }
  const Tl = mDirT(C, t[0] - C[3], t[1] - C[7], t[2] - C[11]), s0 = sg * SHO_OUT, D = [Tl[0] - s0, Tl[1], Tl[2]];
  let d = Math.hypot(D[0], D[1], D[2]); if (d < 1e-5) return null;
  const u = [D[0] / d, D[1] / d, D[2] / d];
  d = clamp(d, .06, (UPPER + FORE) * .999);
  const ca = clamp((UPPER * UPPER + d * d - FORE * FORE) / (2 * UPPER * d), -1, 1), sa = Math.sqrt(1 - ca * ca);
  const e = PI - Math.acos(clamp((UPPER * UPPER + FORE * FORE - d * d) / (2 * UPPER * FORE), -1, 1));
  const pw = mDir(G, p['p' + Sd + 'x'], p['p' + Sd + 'y'], p['p' + Sd + 'z']), P = mDirT(C, pw[0], pw[1], pw[2]);
  const pd = dot3(P, u); let pp = [P[0] - u[0] * pd, P[1] - u[1] * pd, P[2] - u[2] * pd];
  const pl = Math.hypot(pp[0], pp[1], pp[2]);
  pp = pl < 1e-4 ? norm3(cross3(u, [1, 0, 0])) : [pp[0] / pl, pp[1] / pl, pp[2] / pl];
  const ua = [u[0] * ca + pp[0] * sa, u[1] * ca + pp[1] * sa, u[2] * ca + pp[2] * sa];
  const Ep = [ua[0] * UPPER, ua[1] * UPPER, ua[2] * UPPER], fd = norm3([u[0] * d - Ep[0], u[1] * d - Ep[1], u[2] * d - Ep[2]]);
  const fu = dot3(fd, ua);
  let zb = [fd[0] - ua[0] * fu, fd[1] - ua[1] * fu, fd[2] - ua[2] * fu];
  zb = Math.hypot(zb[0], zb[1], zb[2]) < 1e-4 ? [-pp[0], -pp[1], -pp[2]] : norm3(zb);
  const Y = [-ua[0], -ua[1], -ua[2]], X = cross3(Y, zb);
  IKR[0] = X[0]; IKR[1] = Y[0]; IKR[2] = zb[0]; IKR[3] = s0;
  IKR[4] = X[1]; IKR[5] = Y[1]; IKR[6] = zb[1]; IKR[7] = 0;
  IKR[8] = X[2]; IKR[9] = Y[2]; IKR[10] = zb[2]; IKR[11] = 0;
  return { R: IKR, e };
}

function setW(name, parentName, local) { const b = BONES[BN[name]]; mMul(BONES[BN[parentName]].W, local, b.W); return b.W; }

function evalRig(p, body, dt) {
  mRotY(body.heading, G); G[3] = body.x; G[11] = body.z;
  /* root: T · Ry(yaw) · Rx(pitch) · Rz(roll) */
  const R = BONES[BN.root].W;
  mMul(mRotY(p.yaw, T1), mRotX(p.pitch, T2), T3); mMul(T3, mRotZ(p.roll, T1), T2);
  T2[3] = p.rx; T2[7] = PELVIS_Y + p.ry; T2[11] = p.rz;
  mMul(G, T2, R);
  const S = setW('spine', 'root', mEuler(p.spX, p.spY, p.spZ, 0, WAIST_Y, 0, T1));

  /* look-at (smoothed, split between neck and head; eyes lead) */
  let lyaw = 0, lpitch = 0;
  {
    const np = mPt(S, 0, NECK_Y + .2, 0);
    const D = mDirT(S, look.x - np[0], look.y - np[1], look.z - np[2]);
    look.tYaw = clamp(Math.atan2(D[0], D[2]), -1.25, 1.25);
    look.tPitch = clamp(Math.atan2(D[1], Math.hypot(D[0], D[2])), -.55, .6);
    look.w = damp(look.w, p.look, 6, dt);
    look.yaw = damp(look.yaw, look.tYaw, 5.5, dt); look.pitch = damp(look.pitch, look.tPitch, 5.5, dt);
    lyaw = look.yaw * look.w; lpitch = look.pitch * look.w;
    const egx = clamp((look.tYaw - look.yaw) * 2.2 + look.tYaw * .35, -1, 1) * look.w;
    const egy = clamp((look.tPitch - look.pitch) * 2.2 + look.tPitch * .45, -1, 1) * look.w;
    rigOut.gx = lerp(p.gx, egx, look.w); rigOut.gy = lerp(p.gy, egy, look.w);
  }
  setW('neck', 'spine', mEuler(p.nkX - lpitch * .3, p.nkY + lyaw * .35, p.nkZ, 0, NECK_Y, 0, T1));
  const H = setW('head', 'neck', mEuler(p.hdX - lpitch * .7, p.hdY + lyaw * .65, p.hdZ, 0, HEAD_Y, 0, T1));

  for (const Sd of ['L', 'R']) {
    const sg = Sd === 'L' ? 1 : -1;
    /* arm chain */
    const C = setW('clav' + Sd, 'spine', mEuler(0, 0, 0, sg * SHO_X, SHO_Y + p['sh' + Sd] * .05, 0, T1));
    mEuler(p['a' + Sd + 'x'], sg * p['a' + Sd + 'y'], sg * p['a' + Sd + 'z'], sg * SHO_OUT, 0, 0, T1);
    let el = p['e' + Sd];
    const hw = p['h' + Sd + 'w'];
    if (hw > .001) { const ik = armIK(Sd, sg, p, C, H, S); if (ik) { mBlend(T1, ik.R, hw, T1); el = lerp(el, ik.e, hw); } }
    setW('arm' + Sd, 'clav' + Sd, T1);
    let twA = sg * p['tw' + Sd];
    let F = setW('fore' + Sd, 'arm' + Sd, mEuler(-el, twA, 0, 0, -UPPER, 0, T1));
    mMul(mEuler(0, -sg * PI / 2, 0, 0, -FORE, 0, T2), mEuler(p['w' + Sd + 'x'], 0, sg * p['w' + Sd + 'z'], 0, 0, 0, T3), T6);
    /* optional palm aim: twist the forearm so the palm faces a requested direction (body frame) */
    const nw = p['n' + Sd + 'w'];
    if (nw > .001) {
      mMul(F, T6, T5);
      const a = [F[1], F[5], F[9]], n0 = [T5[2], T5[6], T5[10]], dw = mDir(G, p['n' + Sd + 'x'], p['n' + Sd + 'y'], p['n' + Sd + 'z']);
      const na = dot3(n0, a), da = dot3(dw, a);
      const np = [n0[0] - a[0] * na, n0[1] - a[1] * na, n0[2] - a[2] * na], dp = [dw[0] - a[0] * da, dw[1] - a[1] * da, dw[2] - a[2] * da];
      const dl = Math.atan2(dot3(a, cross3(np, dp)), dot3(np, dp));
      twA += dl * nw;
      F = setW('fore' + Sd, 'arm' + Sd, mEuler(-el, twA, 0, 0, -UPPER, 0, T1));
    }
    mMul(F, T6, BONES[BN['hand' + Sd]].W);
    const c = p['c' + Sd], sp = p['sp' + Sd] || 0, tc = p['t' + Sd];
    for (let i = 0; i < 3; i++) {
      const fx = (i - 1) * .033 * sg, k = 1 + (i - 1) * .08 * sg;
      setW(`f${i}${Sd}`, 'hand' + Sd, mEuler(-c * 1.45 * k, 0, (i - 1) * sg * sp * .18, fx, -.102, 0, T1));
      setW(`f${i}${Sd}b`, `f${i}${Sd}`, mEuler(-c * 1.65, 0, 0, 0, -.047, 0, T1));
    }
    setW('th' + Sd, 'hand' + Sd, mEuler(-.3 - tc * .9, 0, sg * (.62 - tc * .75), sg * .048, -.034, .012, T1));
    setW('th' + Sd + 'b', 'th' + Sd, mEuler(-tc * 1.1, 0, 0, 0, -.04, 0, T1));

    /* leg chain: FK in actual angles, blended towards analytic IK */
    let lx = p['l' + Sd + 'x'], ly = sg * p['l' + Sd + 'y'], lz = sg * p['l' + Sd + 'z'], kn = p['k' + Sd];
    let ax = p['an' + Sd + 'x'], ay = 0, az = sg * p['an' + Sd + 'z'];
    const w = p['ik' + Sd];
    if (w > .001) {
      const hip = mPt(R, sg * HIP_X, HIP_Y, 0);
      const tg = mPt(G, p['f' + Sd + 'x'], p['f' + Sd + 'y'], p['f' + Sd + 'z']);
      const D = mDirT(R, tg[0] - hip[0], tg[1] - hip[1], tg[2] - hip[2]);
      let d = Math.hypot(D[0], D[1], D[2]); const u = [D[0] / d, D[1] / d, D[2] / d];
      d = clamp(d, .12, (THIGH + SHIN) * .9995);
      const x0 = -Math.asin(clamp(u[2], -1, 1)), z0 = Math.atan2(u[0], -u[1]);
      const al = Math.acos(clamp((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d), -1, 1));
      const ki = Math.acos(clamp((THIGH * THIGH + SHIN * SHIN - d * d) / (2 * THIGH * SHIN), -1, 1));
      lx = lerp(lx, x0 - al, w); lz = lerpA(lz, z0, w); ly = lerp(ly, 0, w); kn = lerp(kn, PI - ki, w);
      /* foot: flat on the ground at the requested pitch/yaw */
      mMul(R, mEuler(lx, ly, lz, sg * HIP_X, HIP_Y, 0, T1), T2);
      mMul(T2, mEuler(kn, 0, 0, 0, -THIGH, 0, T1), T3);
      mMul(G, mMul(mRotY(p['f' + Sd + 'w'], T4), mRotX(p['f' + Sd + 'p'], T5), T6), T2);
      mRotT(T3, T7); mMul(T7, T2, T1);
      const e = eulerOf(T1);
      ax = lerp(ax, e[0], w); ay = lerp(0, e[1], w); az = lerp(az, e[2], w);
    }
    setW('thigh' + Sd, 'root', mEuler(lx, ly, lz, sg * HIP_X, HIP_Y, 0, T1));
    setW('shin' + Sd, 'thigh' + Sd, mEuler(kn, 0, 0, 0, -THIGH, 0, T1));
    setW('foot' + Sd, 'shin' + Sd, mEuler(ax, ay, az, 0, -SHIN, 0, T1));
    setW('toe' + Sd, 'foot' + Sd, mEuler(p['to' + Sd], 0, 0, 0, -.06, .07, T1));
  }

}
/* skin: transform every visible mesh by its bone */
function skin() {
  for (const m of SC.meshes) {
    if (!m.vis) continue;
    if (m.custom) { m.custom(m); continue; }
    const W = BONES[m.bone].W;
    const a0 = W[0], a1 = W[1], a2 = W[2], a3 = W[3], a4 = W[4], a5 = W[5], a6 = W[6], a7 = W[7], a8 = W[8], a9 = W[9], a10 = W[10], a11 = W[11];
    for (let v = m.v0 * 3, e = m.v1 * 3; v < e; v += 3) {
      const x = LP[v], y = LP[v + 1], z = LP[v + 2];
      WP[v] = a0 * x + a1 * y + a2 * z + a3; WP[v + 1] = a4 * x + a5 * y + a6 * z + a7; WP[v + 2] = a8 * x + a9 * y + a10 * z + a11;
    }
  }
}

const PROPS = {}, PROP_LIST = [];
function defProp(id, at, build, extra = {}) {
  const bone = '@' + id; addBone(bone);
  const m0 = SC.meshes.length;
  build(bone);
  const m1 = SC.meshes.length;
  for (let i = m0; i < m1; i++) { SC.meshes[i].vis = false; SC.meshes[i].prop = id; }
  const P = Object.assign({ id, bone: BN[bone], m0, m1, at, pres: 0, want: 0, force: null, setNow: false, base: M(), placed: false, decals: null }, extra);
  PROPS[id] = P; PROP_LIST.push(P); return P;
}
/* polar helpers for outlines */
const arcPts = (cx, cy, r, a0, a1, n) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; };
/* outline of a union of circles, star-shaped around (cx,cy) */
function radialUnion(circles, cx, cy, n = 40) {
  const o = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, dx = Math.cos(a), dy = Math.sin(a); let best = 0;
    for (const [x, y, r] of circles) {
      const ox = cx - x, oy = cy - y, b = ox * dx + oy * dy, c = ox * ox + oy * oy - r * r, disc = b * b - c;
      if (disc >= 0) best = Math.max(best, -b + Math.sqrt(disc));
    }
    o.push([cx + dx * best, cy + dy * best]);
  }
  return o;
}

/* build a matrix from a Y axis and a Z axis (re-orthonormalised) at a position */
function basis(Y, Z, pos, o = M()) {
  Y = norm3(Y); let X = norm3(cross3(Y, Z)); Z = cross3(X, Y);
  o[0] = X[0]; o[1] = Y[0]; o[2] = Z[0]; o[3] = pos[0];
  o[4] = X[1]; o[5] = Y[1]; o[6] = Z[1]; o[7] = pos[1];
  o[8] = X[2]; o[9] = Y[2]; o[10] = Z[2]; o[11] = pos[2];
  return o;
}
/* guitars: local X runs up the neck, Y across, Z out of the top. `at` places it in the spine frame. */
function guitar(id, o) {
  const AT = E(...o.rot, ...o.pos);
  const INV = (() => { const r = M(); mRotT(AT, r); const t = mDir(r, -AT[3], -AT[7], -AT[11]); r[3] = t[0]; r[7] = t[1]; r[11] = t[2]; return r; })();
  return defProp(id, ['spine', ...o.pos, ...o.rot], b => {
    const body = slab(o.outline, o.depth), nf = body.f.length;
    addPart(b, body, o.bodyMat, { anchor: id + 'Top', matOf: (i) => i === nf - 1 ? o.topMat : i === nf - 2 ? o.backMat : o.sideMat, bias: -.005 });
    addPart(b, place(bevelBox(o.neck[1] / 2, .02, .012, .005), E(0, 0, 0, o.neck[0] + o.neck[1] / 2, 0, o.depth + .012)), o.neckMat, { anchor: id + 'Neck', anchorFace: 5, shadow: false, bias: -.012 });
    addPart(b, place(slab(o.head, .009), E(0, .2, 0, o.neck[0] + o.neck[1] + .005, 0, o.depth + .006)), o.headMat, { shadow: false, bias: -.01 });
    /* strap: around Emrys's back and over the left shoulder, authored in the spine frame */
    const strapS = [[-.2, .02, .13], [-.155, .07, -.05], [-.13, .17, -.15], [0, .36, -.155], [.15, .532, -.06], [.17, .495, .1], [.12, .34, .155]];
    const tail = mPt(AT, o.tail[0], o.tail[1], o.tail[2]), heel = mPt(AT, o.neck[0] + .02, .03, -o.depth);
    const pts = [tail, ...strapS.slice(1, -1), heel].map(q => mPt(INV, q[0], q[1], q[2]));
    addPart(b, tube(pts, .011, 4, false), 'leather', { shadow: false });
  }, Object.assign({ AT, g: o }, {
    decals(t) {
      const W = BONES[this.bone].W, g = this.g, top = (u, v) => [u, v, g.depth + .0008];
      g.paint(W, top, t);
      const nk = (u, v) => [u, v, g.depth + .0245];
      const fb = [[g.neck[0], -.017], [g.neck[0] + g.neck[1], -.016], [g.neck[0] + g.neck[1], .016], [g.neck[0], .017]];
      decal(id + 'Neck', W, [fb], nk, g.fretboard, 1, 0, 1);
      const frets = []; for (let i = 1; i < 16; i++) { const x = g.neck[0] + g.neck[1] * (1 - Math.pow(.94, i * 1.25)); frets.push([[x, -.016], [x + .0025, -.016], [x + .0025, .016], [x, .016]]); }
      decal(id + 'Neck', W, frets, nk, 'rgb(200,205,212)', .9, 0, 2);
      const s = [], n = g.strings, x0 = g.bridge, x1 = g.neck[0] + g.neck[1];
      for (let i = 0; i < n; i++) { const v = (i - (n - 1) / 2) * (n > 4 ? .0058 : .0075), th = .0007 + (n - i) * .00018, vib = Math.sin(t * 60 + i) * (STRUM.v > 0 ? .0012 * STRUM.v : 0); s.push([[x0, v * 1.5 - th + vib], [x1, v - th], [x1, v + th], [x0, v * 1.5 + th + vib]]); }
      decal(id + 'Neck', W, s, nk, 'rgb(236,238,240)', .95, 0, 3);
    }
  }));
}

  const html = document.documentElement;

  function post(message) {
    try { window.EmrysHost && window.EmrysHost.postMessage(JSON.stringify(message)); } catch (e) { }
  }

  /* the stage glows behind Emrys in the Noir status colour of what it is doing: glacier working, honey waiting on
     the user, sage done, coral listening (a live mic) or stuck */
  const MOOD = {
    listening: 'rec', thinking: 'cy', searching: 'cy', working: 'cy', texting: 'cy', emailing: 'cy',
    calling: 'cy', video: 'cy', waiting: 'amb', done: 'ok', failed: 'rec',
  };
  const glow = document.createElement('style');
  glow.textContent = `
    .stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease;
      background:radial-gradient(38% 34% at 50% 46%,var(--mood-c,transparent),transparent 72%)}
    html[data-mood] .stage::before{opacity:.26;animation:moodbreathe 2.8s ease-in-out infinite}
    html[data-mood="cy"]{--mood-c:#8FDBE8} html[data-mood="amb"]{--mood-c:#E8C07C}
    html[data-mood="ok"]{--mood-c:#97D4A6} html[data-mood="rec"]{--mood-c:#F07B6C}
    html[data-mood] .plate-ring{stroke:var(--mood-c);stroke-opacity:.55;transition:stroke .8s ease}
    html[data-mood] .plate-tick{stroke:var(--mood-c);stroke-opacity:.45}
    html[data-halo] .stage::before{opacity:0;animation:none}
    @keyframes moodbreathe{50%{opacity:.14}}
    @media (prefers-reduced-motion: reduce){html[data-mood] .stage::before{animation:none}}`;
  document.head.appendChild(glow);

  function state(name) {
    const id = STATE_MOVE[name] || 'idle';
    current = name in STATE_MOVE ? name : 'idle';
    const mood = MOOD[current];
    if (mood) html.setAttribute('data-mood', mood);
    else html.removeAttribute('data-mood');
    D.lastInput = time;
    if (D.cur.id !== id && D.settle !== id) play(id);
    publish();
  }

  /* steps: [{tag, text, tone}] newest last; the trace panel shows the last seven */
  function trace(steps) {
    const rows = (steps || []).slice(-7).map(s => ({
      tag: String(s.tag || 'step').slice(0, 8),
      c: TONES.has(s.tone) ? s.tone : 'cy',
      text: String(s.text || '').slice(0, 44),
    }));
    TRACE.splice(0, TRACE.length, ...rows);
    if (H$.kind === 'think') H$.kind = null; // rebuild with the new rows
  }

  function email(o) {
    const lines = (o && o.lines ? o.lines : []).slice(0, 3).map(l => String(l).slice(0, 46));
    EMAIL_LINES.splice(0, EMAIL_LINES.length, ...(lines.length ? lines : ['']));
    emailMeta = { to: String((o && o.to) || ''), subject: String((o && o.subject) || '') };
  }

  /* messages: [{me: bool, text}] oldest first; the last four play out in the phone card */
  function thread(messages, name) {
    contact = name ? String(name).slice(0, 20) : null;
    const last = (messages || []).slice(-4);
    THREAD.splice(0, THREAD.length, ...last.map((m, i) => [THREAD_SLOTS[i], m.me ? 1 : 0, String(m.text || '').slice(0, 28)]));
    if (H$.kind === 'text') H$.kind = null;
  }

  function say(text) {
    // A bubble on a squeezed stage is too small to read.
    if (!text || stage.clientHeight < 200) return;
    emote(String(text).slice(0, 40), [body.x, 1.95, body.z], { vy: .25, life: 3.2, size: .9 });
  }

  /* What is being said, for the stage layer: the last viseme and its weight, and until when words are still being
     spoken (each word's length plus a breath, so the gaps between TTS words count as speech). */
  const SPEECH = { key: 'sil', weight: 0, at: 0, until: 0 };
  const now = () => performance.now();
  const pageViseme = window.emrys.viseme;
  function viseme(key, value) {
    pageViseme(key, value);
    const name = String(key).replace(/^viseme_/, '');
    const weight = +value || 0;
    if (weight > 0) Object.assign(SPEECH, { key: name, weight, at: now() });
    else if (name === SPEECH.key) SPEECH.weight = 0;
  }

  /* lip sync for one spoken word: the app calls this from TTS word boundaries */
  let mouthTimer = null;
  let mouthKey = null;
  function quiet() {
    clearInterval(mouthTimer);
    if (mouthKey) window.emrys.viseme(mouthKey, 0);
    mouthKey = null;
  }
  function mouth(word, seconds) {
    const letters = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
    quiet();
    if (!letters) return;
    const length = seconds > 0 ? seconds : letters.length / 13;
    SPEECH.until = Math.max(SPEECH.until, now() + length * 1000 + 600);
    const step = Math.max(40, (length * 1000) / letters.length);
    let i = 0;
    mouthTimer = setInterval(() => {
      if (mouthKey) window.emrys.viseme(mouthKey, 0);
      if (i >= letters.length) { clearInterval(mouthTimer); mouthKey = null; return; }
      mouthKey = LETTER_VIS[letters[i++]] || 'nn';
      window.emrys.viseme(mouthKey, 0.85);
    }, step);
    publish();
  }
  /* the app's quiet ends the speech too (TTS done, the agent interrupted or listening again) */
  function hush() {
    quiet();
    SPEECH.until = 0;
    SPEECH.weight = 0;
    publish();
  }

  /* The live voice of an ElevenLabs agent session: whose turn it is ('listening' or 'speaking', null when no voice
     session runs), and the real levels the app measures, 0..1 (output: the agent's voice; input: how surely the user
     is speaking), null for a level the app doesn't have. Ending the session clears both. */
  const VOICE = { turn: null, output: null, input: null, at: 0 };
  const unit = v => (typeof v === 'number' && Number.isFinite(v) ? Math.min(1, Math.max(0, v)) : null);
  function voice(turn) {
    VOICE.turn = turn === 'listening' || turn === 'speaking' ? turn : null;
    if (!VOICE.turn) Object.assign(VOICE, { output: null, input: null, at: 0 });
    publish();
  }
  function levels(output, input) {
    Object.assign(VOICE, { output: unit(output), input: unit(input), at: now() });
  }
  function speech() {
    return {
      key: SPEECH.key, weight: SPEECH.weight, at: SPEECH.at, talking: talking(),
      turn: VOICE.turn, output: VOICE.output, input: VOICE.input, levelAt: VOICE.at,
    };
  }
  const talking = () => VOICE.turn === 'speaking' || now() < SPEECH.until;

  /* the app's light/dark setting wins over the WebView's media query */
  function theme(name) {
    document.documentElement.setAttribute('data-theme', name === 'dark' ? 'dark' : 'light');
  }

  /* camera framing: 'stage' fills a full-height stage, 'card' sits the robot in a short card, 'greet' stands it
     in the upper part of the stage so a greeting fits under its feet. ty is the look-at height the page eases
     back to at rest (a lower one lifts the robot in the frame); a double tap resets the view to zoom 1 and the
     framing is put back after it. */
  const FOCUS = { stage: { zoom: 1, ty: 1.1 }, card: { zoom: 1.3, ty: .86 }, greet: { zoom: 1.25, ty: .5 } };
  /* a short greeting stage (large text, small phones) stands Emrys further back so its feet stay above the words */
  const GREET_SHORT = { zoom: 1.5, ty: .34 };
  let focusMode = 'stage';
  let focusZoom = 1;
  function framing() {
    return focusMode === 'greet' && stage.clientHeight < 470 ? GREET_SHORT : FOCUS[focusMode];
  }
  function focus(mode) {
    if (!Object.prototype.hasOwnProperty.call(FOCUS, mode)) return;
    focusMode = mode;
    const f = framing();
    focusZoom = f.zoom;
    cam.rest = f.ty;
    cam.zoom = focusZoom;
    cam.dirty = true;
  }
  window.addEventListener('resize', () => { if (focusMode === 'greet') focus(focusMode); });
  stage.addEventListener('dblclick', () => { cam.zoom = focusZoom; cam.dirty = true; });

  /* Where Emrys stands on the stage, in stage pixels: the head (just above the head bone) and the feet. Read through
     the page's own camera; null when the page draws no such skeleton. */
  const view = stage.querySelector(':scope > svg');
  const point = view && view.createSVGPoint ? view.createSVGPoint() : null;
  const out = [0, 0, 0];
  function anchor() {
    try {
      const m = view.getScreenCTM(), r = stage.getBoundingClientRect();
      const at = (x, y, z) => {
        proj(x, y, z, out);
        point.x = out[0]; point.y = out[1];
        const p = point.matrixTransform(m);
        return [Math.round(p.x - r.left), Math.round(p.y - r.top)];
      };
      const h = mPt(BONES[BN.head].W, 0, .22, 0);
      const [x, y] = at(h[0], h[1], h[2]);
      const [feetX, feetY] = at(body.x, 0, body.z);
      return [x, y, feetX, feetY].every(Number.isFinite) ? { x, y, feetX, feetY } : null;
    } catch (e) {
      return null;
    }
  }

  /* What the stage layer draws from, published as a `emrys:stage` event when any of it changes. */
  let info = null;
  let infoKey = '';
  function stageInfo() {
    let hud = false, low = false, move = null;
    try { hud = !!(H$.kind && H$.el && H$.a > .05); } catch (e) { }
    try { low = typeof lowFx !== 'undefined' && !!lowFx; } catch (e) { }
    try { move = D.cur.id || null; } catch (e) { }
    return {
      state: current, mood: MOOD[current] || null, talking: talking(), turn: VOICE.turn, hud, lowFx: low, move,
      width: stage.clientWidth, height: stage.clientHeight, short: stage.clientHeight < 200, anchor: anchor(),
    };
  }
  function publish() {
    const next = stageInfo();
    if (next.talking) html.setAttribute('data-voice', 'speaking');
    else html.removeAttribute('data-voice');
    const key = JSON.stringify(next);
    if (key === infoKey) return;
    infoKey = key;
    info = next;
    document.dispatchEvent(new CustomEvent('emrys:stage', { detail: info }));
  }

  function tick() {
    const id = STATE_MOVE[current];
    if (HOLD.has(id) && D.cur.id !== id && D.settle !== id) play(id);
    if (emailMeta && H$.kind === 'email' && H$.el) {
      const fields = H$.el.querySelectorAll('.card text.hud-t:not(.ebody)');
      if (fields[0] && fields[0].textContent !== emailMeta.to) fields[0].textContent = emailMeta.to;
      if (fields[1] && fields[1].textContent !== emailMeta.subject) fields[1].textContent = emailMeta.subject;
    }
    if (contact && H$.kind === 'text' && H$.el) {
      const title = H$.el.querySelector('.card .hud-h');
      if (title && title.textContent !== contact) title.textContent = contact;
    }
    publish();
  }
  setInterval(tick, 250);

  Object.assign(window.emrys, {
    state, trace, email, thread, say, mouth, quiet: hush, viseme, theme, focus, voice, levels, speech,
    stageInfo: () => info || stageInfo(), states: () => Object.keys(STATE_MOVE),
  });
  publish();
  post({ type: 'ready', moves: window.emrys.moves(), states: Object.keys(STATE_MOVE) });
})();
</script>
<script src="vendor/stage-ui.js"></script>
</body></html>
