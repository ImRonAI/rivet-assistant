<style>

}
@media (prefers-color-scheme: dark){

    --plate:#11161B; --plate-line:rgba(232,236,240,.09); --plate-tick:rgba(232,236,240,.30);

  }
}
:root[data-theme="dark"]{
  --bg:#0B0E12; --bg-hi:#161B22; --ink:#E8ECF0; --ink-2:#8A949E;
  --plate:#11161B; --plate-line:rgba(232,236,240,.09); --plate-tick:rgba(232,236,240,.30);

}
html,body{height:100%}

.app{min-height:100%;display:grid;grid-template-rows:minmax(320px,1fr)}

.stage{position:relative;min-width:0;background:radial-gradient(60% 55% at 50% 42%,var(--bg-hi),var(--bg) 100%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

function step(dt) {

  copyPose(work, REST);
  if (D.settle) {
    D.settleT += dt;
    locoStep(dt, { speed: 0, face: body.heading });
    locoPose(work, D.t, .5);
    if (!LOCO.moving || D.settleT > 1.1) { const id = D.settle; D.settle = null; play(id, { force: true }); copyPose(work, REST); D.cur.run(work, 0, dt, ctx); }
  } else D.cur.run(work, D.t, dt, ctx);
  if (D.cur.ev) for (const [et, fn] of D.cur.ev) if (D.t >= et && !D.fired.has(et)) { D.fired.add(et); fn(ctx); }
  const b = smooth(D.blendT / D.blendDur);
  if (b < 1) blendPose(pose, D.prev, work, b); else copyPose(pose, work);
  layers(pose, dt);
  SCENE.light = D.cur.light || 'default';
  updateLightRig(dt);
  if (D.cur.dur && D.t >= D.cur.dur) finish();
  /* idle upkeep: turn to face the viewer after they orbit around */
  if (D.cur.id === 'idle') {
    D.idleT += dt;
    if (D.idleT > 2.6 && !dragging && Math.abs(wrapA(cam.yaw + cam.sway - body.heading)) > 1.15) play('turn');
    else if (D.idleT > D.fidgetAt) { D.fidgetAt = 7 + Math.random() * 6; play(['stretch', 'scan', 'tap'][D.fidgetN++ % 3]); }
  }
  /* camera follows the robot loosely */
  cam.tx = damp(cam.tx, body.x * .55, 2, dt); cam.tz = damp(cam.tz, body.z * .55, 2, dt);
  const hint = D.camHint && !D.camUser ? D.camHint : null;
  cam.ty = damp(cam.ty, (hint && hint.ty ? hint.ty : cam.rest) + Math.max(0, pose.ry) * .5, 2.5, dt);
  if (hint) {
    cam.yaw = dampA(cam.yaw, hint.yaw, 1.6, dt); cam.pitch = damp(cam.pitch, hint.pitch, 1.6, dt); cam.zoom = damp(cam.zoom, hint.zoom, 1.6, dt);
    if (hint.restore && Math.abs(wrapA(cam.yaw - hint.yaw)) < .01 && Math.abs(cam.zoom - hint.zoom) < .01) D.camHint = null;
  }

    const swayOn = !RM.matches && time - D.lastInput > 3;
    cam.sway = damp(cam.sway, swayOn ? Math.sin(time * .13) * .2 : 0, .6, dt);
    cam.swayP = damp(cam.swayP, swayOn ? Math.sin(time * .09 + 1) * .035 : 0, .6, dt);

  evalRig(pose, body, dt);

}
/* props: presence (pop in/out), default placement, scene overrides */
const FMS = M();
function frameMat(frame, x, y, z, rx, ry, rz, out) { return mMul(frame === 'G' ? G : BONES[BN[frame]].W, mEuler(rx, ry, rz, x, y, z, FMS), out); }
const PL = {
  mat: (frame, x, y, z, rx = 0, ry = 0, rz = 0) => frameMat(frame, x, y, z, rx, ry, rz, M()),
  set(id, m) { const P = PROPS[id]; mCopy(m, P.base); P.setNow = true; P.placed = true; },
  force(id, w) { PROPS[id].force = w; },
};
function placeProps(dt) {
  const want = new Set(D.cur.props || []);
  if (D.blendT < D.blendDur && D.prevMove && D.prevMove.props) for (const id of D.prevMove.props) want.add(id);
  for (const P of PROP_LIST) { P.force = null; P.setNow = false; }
  if (D.cur.place) D.cur.place(PL, D.t);
  for (const P of PROP_LIST) {
    const w = P.force !== null ? P.force : want.has(P.id) ? 1 : 0;
    P.want = w; P.pres = damp(P.pres, w, w > P.pres ? 7 : 10, dt); if (w === 0 && P.pres < .01) P.pres = 0;
    const vis = P.pres > .004;
    for (let i = P.m0; i < P.m1; i++) SC.meshes[i].vis = vis;
    if (!vis) continue;
    if (!P.setNow && (w > 0 || !P.placed)) { const a = P.at; frameMat(a[0], a[1], a[2], a[3], a[4] || 0, a[5] || 0, a[6] || 0, P.base); P.placed = true; }
    const s = w > 0 ? backOut(P.pres, 1.3) : smooth(P.pres);
    mScale(P.base, Math.max(.001, s), BONES[P.bone].W);

}
function render(dt) {
  projectAll(); shadeFaces();
  buildDecals(pose, rigOut.gx, rigOut.gy, time);
  /* antenna LED glow, faded when the head hides it */
  const ex = [];
  if (ant.p && pose.led > .05) {
    const hc = mPt(BONES[BN.head].W, 0, .215, 0); proj(hc[0], hc[1], hc[2], tmp3); const zh = tmp3[2];
    proj(ant.p[0], ant.p[1], ant.p[2], tmp3);
    const occ = clamp(1 - (tmp3[2] - zh - .02) / .1, 0, 1), r = FOC / tmp3[2] * .055;
    if (occ > .02) ex.push([`M${r1(tmp3[0] - r)},${r1(tmp3[1])}a${r1(r)},${r1(r)} 0 1,0 ${r1(2 * r)},0a${r1(r)},${r1(r)} 0 1,0 ${r1(-2 * r)},0Z`, rgbStr(LED_RGB), .75 * occ * clamp(pose.led, 0, 1)]);
  }
  flush(); flushGlow(ex); drawShadows(); drawPool();
  if (cam.dirty) { drawFloor(); cam.dirty = false; }
  drawFx(dt);
}

/* ---------- camera & poke input ---------- */
const stage = $('stage');
let dragging = false, camVel = 0;
const ptrs = new Map(); let down = null, pinch0 = 0, zoom0 = 1;
function resetView() { cam.yaw = body.heading; cam.pitch = .13; cam.zoom = 1; camVel = 0; D.lastInput = time; D.camHint = null; D.camUser = false; if (D.cur.cam) D.camHint = Object.assign({}, D.cur.cam, { yaw: D.cur.cam.yaw + body.heading }); }
stage.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, [e.clientX, e.clientY]); stage.setPointerCapture(e.pointerId);
  D.lastInput = time;
  if (ptrs.size === 1) { down = { x: e.clientX, y: e.clientY, t: performance.now(), target: e.target, moved: false }; cam.yaw += cam.sway; cam.sway = 0; camVel = 0; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom0 = cam.zoom; if (down) down.moved = true; }
});
stage.addEventListener('pointermove', e => {
  const rect = svg.getBoundingClientRect();
  pointer.x = e.clientX - rect.left; pointer.y = e.clientY - rect.top; pointer.active = true; pointer.t = time; D.lastInput = time;
  pointer.part = e.target.__face >= 0 ? fPart[e.target.__face] : 0;
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); cam.zoom = clamp(zoom0 * pinch0 / Math.max(10, d), .5, 1.8); return; }
  if (!down) return;
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down.moved = true; dragging = true; D.camUser = true; stage.classList.add('dragging'); }
  if (dragging) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    cam.yaw -= dx * .0085; cam.pitch = clamp(cam.pitch + dy * .006, .03, 1.2); camVel = -dx * .0085 / Math.max(.008, 1 / 60);
    D.lastInput = time;
  }
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (down && !down.moved && ptrs.size === 0) {
    const f = down.target && down.target.__face;
    if (f >= 0) poke(fPart[f]);
  }
  if (ptrs.size === 0) { down = null; dragging = false; stage.classList.remove('dragging'); camVel = clamp(camVel, -6, 6) * .25; }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('pointerleave', () => { pointer.active = false; });
stage.addEventListener('wheel', e => { e.preventDefault(); D.camUser = true; cam.zoom = clamp(cam.zoom * Math.exp(e.deltaY * .0012), .5, 1.8); D.lastInput = time; }, { passive: false });
stage.addEventListener('dblclick', resetView);

function resize() {
  const r = stage.getBoundingClientRect();
  VW = Math.max(200, Math.round(r.width)); VH = Math.max(200, Math.round(r.height));
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  fitCamera();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- boot ---------- */
locoPlant();
let last = performance.now(), slowT = 0, lowFx = false;
function degrade() { lowFx = true; $('gGlow').style.display = 'none'; $('fShadow').firstElementChild.setAttribute('stdDeviation', '4'); }
function frame(now) {
  const dt = Math.min(.05, Math.max(.001, (now - last) / 1000)); last = now;
  step(dt); render(dt);
  if (!lowFx && !document.hidden) { if (dt > 1 / 24) slowT += dt; else slowT = Math.max(0, slowT - dt * .5); if (slowT > 4) degrade(); }
  requestAnimationFrame(frame);
}
step(1 / 60); render(1 / 60);
requestAnimationFrame(frame);
window.rivet = {
  viseme(key, value) { key = String(key).replace(/^viseme_/, ''); key = VALIAS[key] || key; MOUTH.ext[key] = +value || 0; MOUTH.extT = time; },
};
</script>

<script>
/* Rivet app bridge. Loaded after the robot page's own script, so it shares its top-level bindings
   (play, D, time, cam, stage, LETTER_VIS).
   The app drives it with window.rivet.{state,mouth,quiet,viseme,theme,focus}; the page reports back to
   the app through the RivetHost web message listener the app installs. */
(() => {
  const STATE_MOVE = {
    idle: 'idle', listening: 'idle', thinking: 'think', searching: 'think', working: 'desk',
    texting: 'text', emailing: 'email', calling: 'phone', waiting: 'idle', done: 'cheer', failed: 'shrug',
  };

  function post(message) {
    try { window.RivetHost && window.RivetHost.postMessage(JSON.stringify(message)); } catch (e) { }
  }

  /* the stage glows behind Rivet in the colour of what it is doing: cyan working, amber waiting on the user,
     green done, crimson listening (a live sensor) or stuck */
  const MOOD = {
    listening: 'rec', thinking: 'cy', searching: 'cy', working: 'cy', texting: 'cy', emailing: 'cy',
    calling: 'cy', waiting: 'amb', done: 'ok', failed: 'rec',
  };
  const glow = document.createElement('style');
  glow.textContent = `
    .stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease;
      background:radial-gradient(38% 34% at 50% 46%,var(--mood-c,transparent),transparent 72%)}
    html[data-mood] .stage::before{opacity:.26;animation:moodbreathe 2.8s ease-in-out infinite}
    html[data-mood="cy"]{--mood-c:var(--cy)} html[data-mood="amb"]{--mood-c:var(--amb)}
    html[data-mood="ok"]{--mood-c:var(--ok)} html[data-mood="rec"]{--mood-c:var(--rec)}
    html[data-mood] .plate-ring{stroke:var(--mood-c);stroke-opacity:.55;transition:stroke .8s ease}
    html[data-mood] .plate-tick{stroke:var(--mood-c);stroke-opacity:.45}
    @keyframes moodbreathe{50%{opacity:.14}}
    @media (prefers-reduced-motion: reduce){html[data-mood] .stage::before{animation:none}}`;
  document.head.appendChild(glow);

  function state(name) {
    const id = STATE_MOVE[name] || 'idle';
    const current = name in STATE_MOVE ? name : 'idle';
    const mood = MOOD[current];
    if (mood) document.documentElement.setAttribute('data-mood', mood);
    else document.documentElement.removeAttribute('data-mood');
    D.lastInput = time;
    if (D.cur.id !== id && D.settle !== id) play(id);
  }

  /* lip sync for one spoken word: the app calls this from TTS word boundaries */
  let mouthTimer = null;
  let mouthKey = null;
  function quiet() {
    clearInterval(mouthTimer);
    if (mouthKey) window.rivet.viseme(mouthKey, 0);
    mouthKey = null;
  }
  function mouth(word, seconds) {
    const letters = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
    quiet();
    if (!letters) return;
    const step = Math.max(40, ((seconds > 0 ? seconds : letters.length / 13) * 1000) / letters.length);
    let i = 0;
    mouthTimer = setInterval(() => {
      if (mouthKey) window.rivet.viseme(mouthKey, 0);
      if (i >= letters.length) { clearInterval(mouthTimer); mouthKey = null; return; }
      mouthKey = LETTER_VIS[letters[i++]] || 'nn';
      window.rivet.viseme(mouthKey, 0.85);
    }, step);
  }

  /* the app's light/dark setting wins over the WebView's media query */
  function theme(name) {
    document.documentElement.setAttribute('data-theme', name === 'dark' ? 'dark' : 'light');
  }

  /* camera framing: 'stage' fills a full-height stage, 'card' sits the robot in a short card, 'greet' stands it
     in the upper part of the stage so a greeting fits under its feet. ty is the look-at height the page eases
     back to at rest (a lower one lifts the robot in the frame); a double tap resets the view to zoom 1 and the
     framing is put back after it. */
  const FOCUS = { stage: { zoom: 1, ty: 1.1 }, card: { zoom: 1.3, ty: .86 }, greet: { zoom: 1.25, ty: .5 } };
  /* a short greeting stage (large text, small phones) stands Rivet further back so its feet stay above the words */
  const GREET_SHORT = { zoom: 1.5, ty: .34 };
  let focusMode = 'stage';
  let focusZoom = 1;
  function framing() {
    return focusMode === 'greet' && stage.clientHeight < 470 ? GREET_SHORT : FOCUS[focusMode];
  }
  function focus(mode) {
    if (!Object.prototype.hasOwnProperty.call(FOCUS, mode)) return;
    focusMode = mode;
    const f = framing();
    focusZoom = f.zoom;
    cam.rest = f.ty;
    cam.zoom = focusZoom;
    cam.dirty = true;
  }
  window.addEventListener('resize', () => { if (focusMode === 'greet') focus(focusMode); });
  stage.addEventListener('dblclick', () => { cam.zoom = focusZoom; cam.dirty = true; });

  Object.assign(window.rivet, { state, mouth, quiet, theme, focus });
  post({ type: 'ready' });
})();
</script>
