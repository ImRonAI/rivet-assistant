name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Robot asset is up to date
        run: python3 tools/build_robot_asset.py --check
      - name: Unit tests, lint, release build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-apk
          path: android/app/build/outputs/apk/release/app-release.apk
