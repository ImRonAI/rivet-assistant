name: brain

on:
  push:
    branches: [main]
    paths: ["brain/**", ".github/workflows/brain.yml"]
  pull_request:
    paths: ["brain/**", ".github/workflows/brain.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: brain

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked PyPI releases)
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Format
        run: uv run --frozen ruff format --check src tests scripts
      - name: Types
        run: uv run --frozen mypy src
      - name: Tests (unit, chaos, gateway; live tests need keys and are excluded)
        run: uv run --frozen pytest -q -m "not live"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build --tag rivet-brain:ci .
