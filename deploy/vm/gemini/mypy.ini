# mypy --config-file deploy/vm/gemini/mypy.ini, with the image's packages (see the Dockerfile).
# disallow_any_expr stays off: Strands' stream_async yields its events as Any, and the ElevenLabs SDK's agent
# config types its dynamic variables with Any.
[mypy]
files = deploy/vm/gemini/app.py, deploy/vm/gemini/providers.py
mypy_path = deploy/vm/gemini
plugins = pydantic.mypy
strict = True
warn_unreachable = True
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True

# ren's model layer, copied as ren has it (providers.py's header): its SDK adapters and catalogues type provider payloads as
# Any, so explicit Any is allowed in these three files only.
[mypy-mistral_model,media_capabilities,context_windows]
disallow_any_explicit = False

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
