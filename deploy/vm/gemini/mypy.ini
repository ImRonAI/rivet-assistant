# mypy --config-file deploy/vm/gemini/mypy.ini, with the image's packages (see the Dockerfile).
# disallow_any_expr stays off: Strands' stream_async yields its events as Any, and the ElevenLabs SDK's agent
# config types its dynamic variables with Any.
[mypy]
files = deploy/vm/gemini/app.py
plugins = pydantic.mypy
strict = True
warn_unreachable = True
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
