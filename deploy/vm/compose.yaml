services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: computer.env
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

  # The owner's desktop: linuxserver's webtop with the toolbox's developer tools.
  laptop:
    build:
      context: ./laptop
      additional_contexts:
        toolbox: ./toolbox
    image: emrys-laptop:ls219
    restart: unless-stopped
    shm_size: "1gb"
    # The desktop's X server (Xvfb :1, started with -ac and MIT-SHM) is shared with the agents' containers: its socket
    # through the x11 volume and its shared memory through this IPC namespace.
    ipc: shareable
    env_file: laptop.env
    environment:
      PUID: "1000"
      PGID: "1000"
      SELKIES_ALLOWED_ORIGINS: "https://desktop.rivet.ron-ai.dev"
    volumes:
      - laptop_home:/config
      - x11:/tmp/.X11-unix

  code:
    image: gitpod/openvscode-server:1.105.1
    restart: unless-stopped
    init: true
    logging:
      driver: none
    entrypoint:
      - /home/.openvscode-server/bin/openvscode-server
      - --host
      - 0.0.0.0
      - --connection-token-file
      - /run/secrets/code-token
      - --default-folder
      - /home/workspace/workspace
    volumes:
      - laptop_home:/home/workspace
      - ./code-token:/run/secrets/code-token:ro

  # Desktop Commander for the ElevenLabs agents: terminal and files in the laptop's home, where OpenCode lives.
  computer:
    build:
      context: ./computer
      additional_contexts:
        toolbox: ./toolbox
    image: emrys-computer:0.3.1
    restart: unless-stopped
    env_file: laptop.env
    # The laptop's desktop, display :1, with its processes (so `pgrep chromium` sees the desktop's browser).
    ipc: service:laptop
    pid: service:laptop
    environment:
      DISPLAY: ":1"
    mem_limit: 4g
    volumes:
      - laptop_home:/config
      - x11:/tmp/.X11-unix

  # The agents' webhooks at https://hooks.oubliai.com: Task agent jobs that outlive the conversation, then a callback.
  hooks:
    image: emrys-computer:0.3.1
    restart: unless-stopped
    command: ["/opt/bridge/bin/python", "/opt/bridge/hooks.py"]
    env_file:
      - elevenlabs.env
      - hooks.env
    mem_limit: 4g
    volumes:
      - laptop_home:/config

  # The Gemini agents (Strands) for the phone, at wss://rivet.ron-ai.dev/gemini/.
  gemini:
    build: ./gemini
    image: emrys-gemini:1.64.0
    restart: unless-stopped
    env_file:
      - elevenlabs.env
      - gemini.env
      # The Brave keys, for ren's Brave tools.
      - search.env
    environment:
      # NIM's default text model (ren's `NIM_MODEL`; owner, 2026-11-13).
      NIM_MODEL: minimaxai/minimax-m3.1-flash
      # The laptop's desktop, display :1.
      DISPLAY: ":1"
    ipc: service:laptop
    pid: service:laptop
    mem_limit: 4g
    volumes:
      - laptop_home:/config
      - x11:/tmp/.X11-unix

  # Ren's hub: one MCP server joining the phone and ren desktop, at https://rivet.ron-ai.dev/hub/.
  hub:
    build: ./hub
    image: ren-hub:3.4.0
    restart: unless-stopped
    mem_limit: 1g

  # Ren's search and Discover (ren desktop's own backend code) for the phone, at https://rivet.ron-ai.dev/search/ and /discover/.
  search:
    build: ./search
    image: ren-search:b112adf
    restart: unless-stopped
    env_file: search.env
    mem_limit: 2g
    volumes:
      - search_sessions:/home/ren/sessions

volumes:
  search_sessions:
  caddy_data:
  caddy_config:
  laptop_home:
  x11:
