services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: computer.env
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

  # The owner's desktop: linuxserver's webtop with the toolbox's developer tools.
  laptop:
    build:
      context: ./laptop
      additional_contexts:
        toolbox: ./toolbox
    image: emrys-laptop:ls219
    restart: unless-stopped
    shm_size: "1gb"
    # The desktop's X server (Xvfb :1, started with -ac and MIT-SHM) is shared with the agents' containers: its socket
    # through the x11 volume and its shared memory through this IPC namespace.
    ipc: shareable
    env_file: laptop.env
    environment:
      PUID: "1000"
      PGID: "1000"
      SELKIES_ALLOWED_ORIGINS: "https://desktop.rivet.ron-ai.dev"
    volumes:
      - laptop_home:/config
      - x11:/tmp/.X11-unix

  code:
    image: gitpod/openvscode-server:1.105.1
    restart: unless-stopped
    init: true
    logging:
      driver: none
    entrypoint:
      - /home/.openvscode-server/bin/openvscode-server
      - --host
      - 0.0.0.0
      - --connection-token-file
      - /run/secrets/code-token
      - --default-folder
      - /home/workspace/workspace
    volumes:
      - laptop_home:/home/workspace
      - ./code-token:/run/secrets/code-token:ro

  # Desktop Commander for the ElevenLabs agents: terminal and files in the laptop's home, where OpenCode lives.
  computer:
    build:
      context: ./computer
      additional_contexts:
        toolbox: ./toolbox
    image: emrys-computer:0.3.1
    restart: unless-stopped
    env_file: laptop.env
    # The laptop's desktop, display :1, with its processes (so `pgrep chromium` sees the desktop's browser).
    ipc: service:laptop
    pid: service:laptop
    environment:
      DISPLAY: ":1"
    mem_limit: 4g
    volumes:
      - laptop_home:/config
      - x11:/tmp/.X11-unix

  # The agents' webhooks at https://hooks.oubliai.com: Task agent jobs that outlive the conversation, then a callback.
  hooks:
    image: emrys-computer:0.3.1
    restart: unless-stopped
    command: ["/opt/bridge/bin/python", "/opt/bridge/hooks.py"]
    env_file:
      - elevenlabs.env
      - hooks.env
    mem_limit: 4g
    volumes:
      - laptop_home:/config

  # The Gemini agents (Strands) for the phone, at wss://rivet.ron-ai.dev/gemini/.
  gemini:
    build: ./gemini
    image: emrys-gemini:1.64.0
    restart: unless-stopped
    env_file:
      - elevenlabs.env
      - gemini.env
      # The Brave keys, for ren's Brave tools.
      - search.env
    environment:
      # NIM's default text model (ren's `NIM_MODEL`; owner, 2026-11-13).
      NIM_MODEL: minimaxai/minimax-m3.1-flash
      # The laptop's desktop, display :1.
      DISPLAY: ":1"
    ipc: service:laptop
    pid: service:laptop
    mem_limit: 4g
    volumes:
      - laptop_home:/config
      - x11:/tmp/.X11-unix

  # Ren's hub: one MCP server joining the phone and ren desktop, at https://rivet.ron-ai.dev/hub/.
  hub:
    build: ./hub
    image: ren-hub:3.4.0
    restart: unless-stopped
    mem_limit: 1g

  # ren desktop's backend (its agent/api/main.py, as ren desktop runs it) for ren's pages in the app: search, Discover,
  # Projects, Documents, Calendar, Vibe and Build, at https://rivet.ron-ai.dev/.
  ren:
    build: ./ren
    image: ren-api:b112adf
    restart: unless-stopped
    env_file:
      # The Brave keys and NIM's key.
      - search.env
      # SUPABASE_URL and SUPABASE_ANON_KEY (ren's publishable key), for Projects signed in to a ren account.
      - ren.env
    environment:
      # The app's bundled pages (androidx.webkit's WebViewAssetLoader) are the one origin that calls it.
      CORS_ORIGINS: https://appassets.androidplatform.net
      # Sessions, run journals and memory on the volume (ren's `local` storage).
      PANEL_STORAGE: local
      PANEL_STORAGE_DIR: /home/ren/data/storage
      # Search sessions and the guest Projects database (projects.sqlite3).
      SESSION_STORAGE_DIR: /home/ren/data
      NIM_MODEL: minimaxai/minimax-m3.1-flash
    mem_limit: 4g
    volumes:
      - ren_data:/home/ren/data

volumes:
  ren_data:
  caddy_data:
  caddy_config:
  laptop_home:
  x11:
