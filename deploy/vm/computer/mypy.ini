# mypy --config-file deploy/vm/computer/mypy.ini, with the image's packages (fastmcp 4.1.0, elevenlabs 2.75.0).
# disallow_any_expr stays off: the ElevenLabs SDK's lazy client properties and its exception classes are typed with Any.
[mypy]
files = deploy/vm/computer/bridge.py, deploy/vm/computer/hooks.py
plugins = pydantic.mypy
strict = True
warn_unreachable = True
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
