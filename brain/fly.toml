# Fly.io deployment for the Rivet brain: scripts/deploy_fly.sh does the whole thing.
# Secrets go through `fly secrets`, never here: PERPLEXITY_API_KEY, HORIZON_API_KEY, RIVET_DEVICE_TOKEN, and for
# email RIVET_EMAIL_ADDRESS and RIVET_EMAIL_PASSWORD.
app = "rivet-brain-hiron"
primary_region = "sjc"

[env]
  # Where Telnyx's answering assistant reaches the brain (call answering webhooks).
  RIVET_PUBLIC_URL = "https://rivet-brain-hiron.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "rivet_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The phone holds a WebSocket and approval timers run server-side: keep exactly one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
