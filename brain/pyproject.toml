[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "emrys-brain"
version = "0.1.0"
description = "Emrys's brain: a Strands harness agent on Perplexity's Agent API with Telnyx MCP, approvals, and a session-preserving supervisor."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ron AI", email = "support@hi-ron.com" }]
dependencies = [
    # Developed against the ImRonAI/strands-harness-sdk-python fork (commit 8ba04f7); CI pins the
    # matching PyPI releases. Only public APIs present in both are used.
    "strands-agents[openai,otel]>=1.62.0,<2.0.0",
    "strands-harness>=0.3.2,<0.4.0",
    "openai>=2.0.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "starlette>=0.40.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.16.0,<0.17.0",
    "mypy>=1.15.0,<2.4.0",
]

[project.scripts]
emrys-brain = "emrys_brain.gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emrys_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60
markers = [
    "live: needs PERPLEXITY_API_KEY and HORIZON_API_KEY; skipped otherwise",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/emrys_brain"]
